name: CI

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - pa2
      - pa3

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -f Dockerfile.sandbox -t leetkob-sandbox .
      - run: SANDBOX_DOCKER=1 node --test tests/sandbox/sandbox-attacks.test.js
